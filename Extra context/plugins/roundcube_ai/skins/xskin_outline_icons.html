<!DOCTYPE html>
<html lang="en" class="xicons-outlined">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roundcube Plus (xskin) Outlined Icons Catalog</title>
    <style>
        @font-face {
            font-family: 'RcpIconFont';
            src: url('../Extra context/plugins/xframework/assets/fonts/roundcube_plus_icons/roundcube_plus_icons.woff2') format('woff2'),
                 url('../Extra context/plugins/xframework/assets/fonts/roundcube_plus_icons/roundcube_plus_icons.woff') format('woff'),
                 url('../Extra context/plugins/xframework/assets/fonts/roundcube_plus_icons/roundcube_plus_icons.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-bg: #eff6ff;
            --accent-red: #ef4444;
            --badge-bg: #f1f5f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: var(--surface);
            padding: 28px 32px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 12px -2px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #1e293b;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .search-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 280px;
            padding: 10px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus {
            border-color: var(--primary);
        }

        .category-filter {
            padding: 10px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--surface);
            color: var(--text-main);
            cursor: pointer;
        }

        .stats-bar {
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .icon-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px 14px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            cursor: pointer;
        }
        .icon-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -4px rgba(0,0,0,0.08);
            border-color: #cbd5e1;
        }

        .icon-card.candidate {
            border: 1.5px solid #f87171;
            background: #fffafa;
        }

        .candidate-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .icon-glyph {
            font-family: 'RcpIconFont', sans-serif !important;
            font-size: 38px;
            line-height: 1;
            color: #1e293b;
            margin-bottom: 14px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease, transform 0.15s ease;
        }
        .icon-card:hover .icon-glyph {
            color: var(--primary);
            transform: scale(1.1);
        }
        .icon-card.candidate .icon-glyph {
            color: #dc2626;
        }

        .icon-name {
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            word-break: break-word;
            margin-bottom: 6px;
        }

        .icon-details {
            font-size: 11px;
            color: var(--text-muted);
            font-family: monospace;
            background: var(--badge-bg);
            padding: 3px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .icon-id {
            font-size: 11px;
            color: #94a3b8;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.2);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

            <div class="subtitle">

            <div class="search-controls">

            </div>
            <div class="stats-bar">
                <span id="resultsCount">Showing 160 icons</span>
                <span>Unicode Range: <code>\ebf0</code> &ndash; <code>\ec8f</code></span>
            </div>
        </header>

        <div id="iconGrid" class="grid"></div>
    </div>

        const grid = document.getElementById("iconGrid");
        const searchInput = document.getElementById("searchInput");
        const categoryFilter = document.getElementById("categoryFilter");
        const resultsCount = document.getElementById("resultsCount");
        const toast = document.getElementById("toast");

        function showToast(msg) {
            toast.innerText = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2000);
        }

        function render(filtered) {
            grid.innerHTML = "";
            resultsCount.innerText = `Showing ${filtered.length} icon${filtered.length === 1 ? "" : "s"}`;
            filtered.forEach(item => {
                const card = document.createElement("div");
                card.className = "icon-card" + (item.is_spam_candidate ? " candidate" : "");
                const badge = item.is_spam_candidate ? '<span class="candidate-badge">Spam Pick</span>' : '';
                card.innerHTML = `
                    ${badge}
                    <div class="icon-glyph">&#x${item.raw_hex};</div>
                    <div class="icon-name">${item.name}</div>
                    <div class="icon-details">${item.hex}</div>
                    <div class="icon-id">ID: ${item.id} &bull; .${item.class}</div>
                `;
                card.onclick = () => {
                    navigator.clipboard.writeText(item.name);
                    showToast(`Copied "${item.name}" to clipboard!`);
                };
                grid.appendChild(card);
            });
        }

        function filter() {
            const query = searchInput.value.toLowerCase().trim();
            const cat = categoryFilter.value;
            const filtered = icons.filter(item => {
                const matchesQuery = item.name.toLowerCase().includes(query) || item.hex.includes(query) || String(item.id).includes(query);
                const matchesCat = (cat === "all") || (cat === "spam" && item.is_spam_candidate) || (item.category === cat);
                return matchesQuery && matchesCat;
            });
            render(filtered);
        }

        searchInput.addEventListener("input", filter);
        categoryFilter.addEventListener("change", filter);

        render(icons);
    </script>
