<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title></title>
        <link rel="stylesheet" href="styles/styles.css" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                background: var(--color-surface);
            }
            .wm {
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px;
                text-align: center;
            }
            .wm-icon {
                display: grid;
                place-items: center;
                width: 80px;
                height: 80px;
                margin-bottom: 24px;
                border-radius: 24px;
                background: var(--color-surface-container-high);
                color: var(--color-primary);
            }
            .wm-icon .ico {
                font-size: 36px;
            }
            h1 {
                margin: 0 0 8px;
                font: 500 20px / 28px var(--font-sans);
                color: var(--color-on-surface);
            }
            p {
                margin: 0;
                max-width: 280px;
                font: 400 14px / 22px var(--font-sans);
                color: var(--color-on-surface-variant);
            }
        </style>
        <script>
            try {
                document.documentElement.classList.toggle(
                    'dark-mode',
                    parent.document.documentElement.classList.contains('dark-mode')
                );
            } catch (e) {}
        </script>
    </head>
    <body>
        <main class="wm">
            <div class="wm-icon" aria-hidden="true"><i class="ico ico-mail"></i></div>
            <h1>No message selected</h1>
            <p>Select a message to read it here.</p>
        </main>
        <script>
            try {
                const task = parent.rcmail?.env?.task;
                const action = parent.rcmail?.env?.action;
                const states = {
                    addressbook: [
                        'ico-contacts',
                        'No contact selected',
                        'Select a contact to see their details.',
                    ],
                    settings: [
                        'ico-settings',
                        'Your preferences',
                        'Choose a section to customize your webmail.',
                    ],
                };
                const settingsStates = {
                    folders: [
                        'ico-folder',
                        'Your folders',
                        'Select a folder to manage its settings.',
                    ],
                    identities: [
                        'ico-person',
                        'Your identities',
                        'Select an identity to edit its details and signature.',
                    ],
                    responses: [
                        'ico-description',
                        'Saved responses',
                        'Create a response or select one to edit.',
                    ],
                    'plugin.managesieve': [
                        'ico-filter-list',
                        'Mail filters',
                        'Select a filter to edit its rules and actions.',
                    ],
                    'plugin.carddav': [
                        'ico-contacts',
                        'Connected address books',
                        'Add an account or select an address book to manage it.',
                    ],
                };
                if (task === 'settings' && settingsStates[action])
                    states.settings = settingsStates[action];
                if (states[task]) {
                    const [icon, title, description] = states[task];
                    document.querySelector('.ico').className = 'ico ' + icon;
                    document.querySelector('h1').textContent = title;
                    document.querySelector('p').textContent = description;
                }
            } catch (e) {}
        </script>
    </body>
</html>
