<roundcube:if condition="!env:framed || env:extwin" />
<html>
<roundcube:else />
<html class="iframe">
<roundcube:endif />
<head>
    <roundcube:object name="meta" />
    <roundcube:object name="links" />
    <link rel="stylesheet" href="/styles/styles.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <roundcube:link rel="stylesheet" href="/styles/print.css" condition="env:action == 'print'" />
    <roundcube:if condition="env:action != 'print' && config:dark_mode_support" />
    <script>
    /* Pre-paint theme resolution (before CSS applies → no flash). Tri-state cookie
       colorMode=dark|light|auto; anything else = auto = follow prefers-color-scheme. */
    (function () {
        try {
            var m = (document.cookie.match(/(?:^|;\s*)colorMode=(dark|light|auto)/) || [])[1] || 'auto';
            var dark = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            var h = document.documentElement;
            if (dark) h.className += ' dark-mode';
            if (window.frameElement && window.frameElement.classList.contains('gm-cwin-frame')) h.className += ' gm-in-popup';
            h.setAttribute('data-theme', m);
        } catch (e) {}
    })();
    </script>
    <roundcube:endif />
</head>
<body class="task-<roundcube:exp expression="env:error_task ?: env:task ?: 'error'"> action-<roundcube:exp expression="asciiwords(env:action, true, '-') ?: 'none'"><roundcube:if condition="env:extwin" /> extwin<roundcube:endif /><roundcube:if condition="env:framed" /> framed<roundcube:endif />">
    <roundcube:if condition="!env:framed || env:extwin" />
    <div id="<roundcube:exp expression="env:action == 'print' ? 'print-' : ''">layout">
